app = "ortsac-investing"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  DATABASE_URL = "file:./dev.db"

[[services]]
  protocol = "tcp"
  internal_port = 5000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
